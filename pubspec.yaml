name: ja_lan_messenger
description: "JA LAN Messenger - Lightweight, High-Compatibility P2P Office LAN Messenger for Windows Desktop"
publish_to: 'none'
version: 1.8.0+17

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Quản lý State toàn cục & Theme
  provider: ^6.1.2

  # Quản lý cửa sổ Desktop (kích thước, trạng thái, sự kiện)
  window_manager: ^0.5.1

  # Hệ thống phân luồng Logging an toàn
  logging: ^1.3.0
  path: ^1.9.1
  cupertino_icons: ^1.0.8

  # Mã hóa bảo mật P2P & Checksum
  encrypt: ^5.0.3
  crypto: ^3.0.6
  xml: ^7.0.1
  pointycastle: ^3.9.1

  # Chọn file đính kèm truyền qua mạng LAN
  file_picker: ^8.1.7
  desktop_drop: ^0.8.4

  # Đọc ảnh và tệp từ Clipboard trên Desktop
  pasteboard: ^0.5.0
  local_notifier: ^0.1.6
  tray_manager: ^0.5.3

  # Render định dạng Markdown & Khối mã nguồn Code Blocks
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.ico
    - assets/ai_avatar.png

